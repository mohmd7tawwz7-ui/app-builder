<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>آخر أثر ٢ — THE LAST TRACE II</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- لوحة الرسم -->
  <canvas id="game"></canvas>

  <!-- أزرار اللمس -->
  <div id="touch"></div>
  <div id="pausebtn" aria-label="pause">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </div>

  <!-- شريط محرر الأزرار -->
  <div id="editbar">
    <span class="eb-text"></span>
    <button class="btn small eb-reset"></button>
    <button class="btn small primary eb-done"></button>
  </div>

  <!-- القوائم -->
  <div id="ui"></div>

  <!-- شاشة البداية (تحتاج لمسة لتشغيل الصوت) -->
  <div id="start">
    <div class="st-title"></div>
    <div class="st-tap"></div>
  </div>

  <!-- تنبيه تدوير الهاتف -->
  <div id="rotate">
    <svg viewBox="0 0 64 64" width="64" height="64"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="#ccc" stroke-width="3"/><path d="M50 40 a20 20 0 0 1 -16 16" fill="none" stroke="#ccc" stroke-width="3"/><path d="M30 54 l4 3 l1 -5" fill="none" stroke="#ccc" stroke-width="3"/></svg>
    <div id="rotate-text"></div>
  </div>

  <!-- ترتيب التحميل مهم -->
  <script src="js/core.js"></script>
  <script src="js/story2.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/sprites-data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/entities2.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
