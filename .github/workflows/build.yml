{
"name": "Build APK",
"on": {
"workflow_dispatch": {"inputs": {"app_name": {"description": "App name", "required": true, "default": "MyApp"}}},
"push": {"paths": ["www/**"]}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"env": {"APP_NAME": "${{ inputs.app_name || 'MyApp' }}"},
"steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "21"}},
{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
{"name": "Create Android project", "run": "npm init -y && npm install @capacitor/core @capacitor/cli @capacitor/android && npx cap init \"$APP_NAME\" com.mohmd.myapp --web-dir=www && npx cap add android && npx cap sync android"},
{"name": "Build APK", "run": "cd android && chmod +x gradlew && ./gradlew assembleDebug"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "my-app-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk"}}
]
}
}
}
