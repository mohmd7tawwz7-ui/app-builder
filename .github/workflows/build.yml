{
"name": "Build APK",
"on": {
"workflow_dispatch": {"inputs": {
"app_name": {"description": "App name", "required": true, "default": "MyApp"},
"app_id": {"description": "Package id", "required": true, "default": "com.mohmd.myapp"},
"tag": {"description": "Release tag", "required": true, "default": "manual"}
}}
},
"permissions": {"contents": "write"},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"env": {"APP_NAME": "${{ inputs.app_name }}", "APP_ID": "${{ inputs.app_id }}", "TAG": "${{ inputs.tag }}", "GH_TOKEN": "${{ github.token }}"},
"steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "21"}},
{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
{"name": "Create Android project", "run": "npm init -y && npm install @capacitor/core @capacitor/cli @capacitor/android && npx cap init \"$APP_NAME\" \"$APP_ID\" --web-dir=www && npx cap add android && npx cap sync android"},
{"name": "Set icon", "run": "if [ -f app/icon.png ]; then rm -rf android/app/src/main/res/mipmap-anydpi*; for d in android/app/src/main/res/mipmap-*; do cp app/icon.png $d/ic_launcher.png; cp app/icon.png $d/ic_launcher_round.png; done; fi"},
{"name": "Build APK", "run": "cd android && chmod +x gradlew && ./gradlew assembleDebug"},
{"name": "Publish APK", "run": "cp android/app/build/outputs/apk/debug/app-debug.apk \"$TAG.apk\" && gh release create \"$TAG\" \"$TAG.apk\" --title \"$APP_NAME\" --notes \"$APP_ID\""},
{"uses": "actions/upload-artifact@v4", "with": {"name": "my-app-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk"}}
]
}
}
}
