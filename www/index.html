<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>آلة حاسبة متطورة</title>
  <style>
    :root {
      --bg-main: #0c0e12;
      --bg-card: #151921;
      --btn-num: #1b202a;
      --btn-num-active: #28303f;
      --btn-func: #262c38;
      --btn-func-active: #353d4d;
      --btn-op: #ff9500;
      --btn-op-active: #cca300;
      --btn-equals: #10b981;
      --btn-equals-active: #059669;
      --text-main: #f3f4f6;
      --text-muted: #8b949e;
      --danger: #ef4444;
      --radius-btn: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .calculator {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      background: radial-gradient(circle at 50% 0%, #171c26 0%, var(--bg-main) 70%);
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      height: 48px;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--btn-op);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--btn-op);
    }

    .icon-btn {
      background: #181d27;
      border: 1px solid #28303e;
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #232a38;
      color: #fff;
    }

    /* Screen Area */
    .display {
      flex: 1;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 12px 14px;
      overflow: hidden;
      direction: ltr; /* Keeps math left-to-right properly formatted */
    }

    .history-expr {
      color: var(--text-muted);
      font-size: 1.25rem;
      font-weight: 400;
      min-height: 28px;
      word-break: break-all;
      text-align: right;
      width: 100%;
      opacity: 0.85;
      transition: all 0.2s;
    }

    .main-expr {
      color: var(--text-main);
      font-size: 3.5rem;
      font-weight: 300;
      line-height: 1.15;
      word-break: break-all;
      text-align: right;
      width: 100%;
      margin-top: 6px;
      letter-spacing: -0.5px;
      transition: font-size 0.15s ease;
    }

    /* Keyboard */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 8px;
    }

    .btn {
      position: relative;
      border: none;
      outline: none;
      height: 68px;
      border-radius: var(--radius-btn);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, filter 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: scale(0.93);
    }

    /* Button Variants */
    .btn-number {
      background-color: var(--btn-num);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .btn-number:active {
      background-color: var(--btn-num-active);
    }

    .btn-function {
      background-color: var(--btn-func);
      color: #93c5fd;
      font-weight: 600;
      font-size: 1.4rem;
    }
    .btn-function:active {
      background-color: var(--btn-func-active);
    }

    .btn-operator {
      background-color: #2a221b;
      color: var(--btn-op);
      border: 1px solid rgba(255, 149, 0, 0.18);
      font-size: 1.8rem;
    }
    .btn-operator:active, .btn-operator.active-op {
      background-color: var(--btn-op);
      color: #fff;
    }

    .btn-equal {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 1.9rem;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }
    .btn-equal:active {
      filter: brightness(1.2);
    }

    /* History Drawer Panel */
    .history-drawer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12, 14, 18, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .history-drawer.open {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #1f242f;
    }

    .history-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .history-actions {
      display: flex;
      gap: 10px;
    }

    .btn-text-danger {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .btn-text-danger:active {
      background: rgba(239, 68, 68, 0.12);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      background: #151922;
      border: 1px solid #202634;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      transition: background 0.15s;
    }

    .history-item:active {
      background: #1c2331;
    }

    .history-item-calc {
      color: var(--text-muted);
      font-size: 0.95rem;
      direction: ltr;
    }

    .history-item-res {
      color: var(--btn-equals);
      font-size: 1.35rem;
      font-weight: 600;
      direction: ltr;
    }

    .history-empty {
      color: #6b7280;
      text-align: center;
      margin: auto;
      font-size: 1rem;
    }

    /* Small Screens optimization */
    @media (max-height: 680px) {
      .btn {
        height: 56px;
        font-size: 1.4rem;
        border-radius: 18px;
      }
      .main-expr {
        font-size: 2.8rem;
      }
      .keypad {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        حاسبة
      </div>
      <button class="icon-btn" id="openHistoryBtn" aria-label="سجل العمليات" title="سجل العمليات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    </div>

    <!-- Display -->
    <div class="display">
      <div class="history-expr" id="subDisplay"></div>
      <div class="main-expr" id="mainDisplay">0</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn btn-function" data-action="clear" style="color: #f87171;">AC</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-function" data-action="percent">%</button>
      <button class="btn btn-operator" data-action="operator" data-val="÷">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-number" data-num="7">7</button>
      <button class="btn btn-number" data-num="8">8</button>
      <button class="btn btn-number" data-num="9">9</button>
      <button class="btn btn-operator" data-action="operator" data-val="×">×</button>

      <!-- Row 3 -->
      <button class="btn btn-number" data-num="4">4</button>
      <button class="btn btn-number" data-num="5">5</button>
      <button class="btn btn-number" data-num="6">6</button>
      <button class="btn btn-operator" data-action="operator" data-val="-">-</button>

      <!-- Row 4 -->
      <button class="btn btn-number" data-num="1">1</button>
      <button class="btn btn-number" data-num="2">2</button>
      <button class="btn btn-number" data-num="3">3</button>
      <button class="btn btn-operator" data-action="operator" data-val="+">+</button>

      <!-- Row 5 -->
      <button class="btn btn-number" data-action="negate">±</button>
      <button class="btn btn-number" data-num="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equal" data-action="calculate">=</button>
    </div>

    <!-- History Panel -->
    <div class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <span class="history-title">سجل العمليات</span>
        <div class="history-actions">
          <button class="btn-text-danger" id="clearHistoryBtn">مسح السجل</button>
          <button class="icon-btn" id="closeHistoryBtn" aria-label="إغلاق">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <!-- Rendered items -->
      </div>
    </div>
  </div>

  <script>
    // State management
    let currentInput = "0";
    let previousInput = "";
    let selectedOperator = null;
    let shouldResetInput = false;
    let history = [];

    // Elements
    const mainDisplay = document.getElementById("mainDisplay");
    const subDisplay = document.getElementById("subDisplay");
    const historyDrawer = document.getElementById("historyDrawer");
    const historyList = document.getElementById("historyList");
    const openHistoryBtn = document.getElementById("openHistoryBtn");
    const closeHistoryBtn = document.getElementById("closeHistoryBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    // Load History
    try {
      const saved = localStorage.getItem("calc_history_dark");
      if (saved) history = JSON.parse(saved);
    } catch (e) {
      history = [];
    }

    // Dynamic Display Scaling
    function updateDisplay() {
      mainDisplay.textContent = currentInput;
      const len = currentInput.length;
      if (len > 12) {
        mainDisplay.style.fontSize = "1.8rem";
      } else if (len > 8) {
        mainDisplay.style.fontSize = "2.4rem";
      } else {
        mainDisplay.style.fontSize = "";
      }

      if (selectedOperator && previousInput !== "") {
        subDisplay.textContent = `${previousInput} ${selectedOperator}`;
      } else {
        subDisplay.textContent = "";
      }
    }

    // Input handlers
    function appendNumber(num) {
      if (shouldResetInput || currentInput === "0") {
        currentInput = num;
        shouldResetInput = false;
      } else {
        if (currentInput.length >= 15) return;
        currentInput += num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (shouldResetInput) {
        currentInput = "0.";
        shouldResetInput = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes(".")) {
        currentInput += ".";
        updateDisplay();
      }
    }

    function toggleSign() {
      if (currentInput === "0" || currentInput === "خطأ") return;
      if (currentInput.startsWith("-")) {
        currentInput = currentInput.slice(1);
      } else {
        currentInput = "-" + currentInput;
      }
      updateDisplay();
    }

    function applyPercentage() {
      const num = parseFloat(currentInput);
      if (isNaN(num)) return;
      const res = num / 100;
      currentInput = formatResult(res);
      updateDisplay();
    }

    function chooseOperator(op) {
      if (currentInput === "خطأ") return;

      if (previousInput !== "" && !shouldResetInput) {
        evaluate(false);
      }
      selectedOperator = op;
      previousInput = currentInput;
      shouldResetInput = true;
      updateDisplay();
    }

    function formatResult(val) {
      if (!isFinite(val) || isNaN(val)) return "خطأ";
      // Avoid rounding issues
      const fixed = parseFloat(val.toPrecision(12));
      return fixed.toString();
    }

    function evaluate(isFinal = true) {
      if (!selectedOperator || previousInput === "") return;

      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);

      if (isNaN(prev) || isNaN(curr)) return;

      let result = 0;
      if (selectedOperator === "+") result = prev + curr;
      else if (selectedOperator === "-") result = prev - curr;
      else if (selectedOperator === "×") result = prev * curr;
      else if (selectedOperator === "÷") {
        if (curr === 0) {
          currentInput = "خطأ";
          subDisplay.textContent = "";
          previousInput = "";
          selectedOperator = null;
          updateDisplay();
          return;
        }
        result = prev / curr;
      }

      const formattedResult = formatResult(result);

      if (isFinal) {
        const equation = `${previousInput} ${selectedOperator} ${currentInput}`;
        saveHistory(equation, formattedResult);
        subDisplay.textContent = `${equation} =`;
        currentInput = formattedResult;
        previousInput = "";
        selectedOperator = null;
        shouldResetInput = true;
      } else {
        currentInput = formattedResult;
        previousInput = formattedResult;
      }

      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = "";
      selectedOperator = null;
      shouldResetInput = false;
      updateDisplay();
    }

    function backspace() {
      if (shouldResetInput || currentInput === "خطأ") {
        clearAll();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
      }
      updateDisplay();
    }

    // History Logic
    function saveHistory(calc, res) {
      if (res === "خطأ") return;
      history.unshift({ calc, res, id: Date.now() });
      if (history.length > 30) history.pop();
      try {
        localStorage.setItem("calc_history_dark", JSON.stringify(history));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = `<div class="history-empty">لا يوجد سجل عمليات حسابية</div>`;
        return;
      }
      historyList.innerHTML = history.map(item => `
        <div class="history-item" data-res="${item.res}">
          <div class="history-item-calc">${item.calc} =</div>
          <div class="history-item-res">${item.res}</div>
        </div>
      `).join("");

      historyList.querySelectorAll(".history-item").forEach(item => {
        item.addEventListener("click", () => {
          currentInput = item.getAttribute("data-res");
          shouldResetInput = false;
          updateDisplay();
          historyDrawer.classList.remove("open");
        });
      });
    }

    clearHistoryBtn.addEventListener("click", () => {
      history = [];
      try {
        localStorage.removeItem("calc_history_dark");
      } catch (e) {}
      renderHistory();
    });

    openHistoryBtn.addEventListener("click", () => {
      renderHistory();
      historyDrawer.classList.add("open");
    });

    closeHistoryBtn.addEventListener("click", () => {
      historyDrawer.classList.remove("open");
    });

    // Handle keypad clicks
    document.querySelector(".keypad").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      // Haptic feedback if supported
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(10);
      }

      if (btn.dataset.num !== undefined) {
        appendNumber(btn.dataset.num);
        return;
      }

      const action = btn.dataset.action;
      switch (action) {
        case "clear":
          clearAll();
          break;
        case "backspace":
          backspace();
          break;
        case "percent":
          applyPercentage();
          break;
        case "operator":
          chooseOperator(btn.dataset.val);
          break;
        case "decimal":
          appendDecimal();
          break;
        case "negate":
          toggleSign();
          break;
        case "calculate":
          evaluate(true);
          break;
      }
    });

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") appendNumber(e.key);
      else if (e.key === ".") appendDecimal();
      else if (e.key === "+") chooseOperator("+");
      else if (e.key === "-") chooseOperator("-");
      else if (e.key === "*" || e.key === "x") chooseOperator("×");
      else if (e.key === "/") {
        e.preventDefault();
        chooseOperator("÷");
      }
      else if (e.key === "Enter" || e.key === "=") evaluate(true);
      else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearAll();
      else if (e.key === "%") applyPercentage();
    });

    // Initial render
    updateDisplay();
  </script>
</body>
</html>
